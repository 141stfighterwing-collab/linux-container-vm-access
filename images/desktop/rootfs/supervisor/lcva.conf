[program:sshd]
command=/usr/sbin/sshd -D -e
priority=10
autostart=true
autorestart=true

[program:vnc]
command=/usr/local/bin/start-vnc.sh
priority=20
autostart=true
autorestart=true

[program:novnc]
command=/usr/local/bin/start-novnc.sh
priority=30
autostart=true
autorestart=true

[program:xrdp]
command=/usr/local/bin/start-xrdp.sh
priority=40
autostart=true
autorestart=true
